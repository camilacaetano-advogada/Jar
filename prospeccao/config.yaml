# Configurações da Camila. Edite à vontade (sem senhas aqui!).

remetente:
  nome: "Camila Arcanjo"
  responder_para: ""          # vazio = responde para o próprio Gmail do .env

perfil:
  instagram: "@camilaarcanjo.c"
  tiktok: "@advocunty"
  portfolio_url: "https://camilacaetano-advogada-github-io.vercel.app/portfolio-ugc/"
  assinatura: |
    Camila Arcanjo
    Criadora de conteúdo · Ipatinga, MG

arquivos:
  planilha: "contatos.xlsx"   # .xlsx ou .csv
  banco: "data/envios.db"
  pdf_portfolio: ""           # ex.: "portfolio.pdf" (vazio = só o link)

envio:
  intervalo_min: 60           # segundos entre e-mails
  intervalo_max: 90           # variação aleatória entre min e max
  limite_diario: 30           # Camila escolheu 30/dia
  horario:
    dias: [0, 1, 2, 3, 4]     # 0 = segunda ... 6 = domingo
    inicio: "09:00"
    fim: "18:00"
    fuso: "America/Sao_Paulo"

followup:
  ativo: true
  dias: 6                     # só para quem não respondeu; no máximo 1 follow-up

# Números só entram no e-mail se você ligar e preencher com dados REAIS.
audiencia:
  ativo: false
  texto: ""                   # ex.: "No TikTok são X mil seguidores e Y mil views por vídeo."

prova_social:
  ativo: false
  texto: ""                   # ex.: "Já fiz conteúdo para A, B e C."

# true = a Camila confirmou que consome/já consumiu TODAS as marcas da lista atual.
# Com isso o e-mail afirma o consumo mesmo sem a coluna 'Motivo consumo'.
consumo_geral: true

aviso_humano:
  ativo: true                 # a piada "não foi escrito por IA, kkk" (só deixe se você revisar os textos!)
